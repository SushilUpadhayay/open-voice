[package]
name = "dictation-client"
version = "0.1.0"
edition = "2021"
description = "Client-side streaming ASR and VAD pipeline using Nemotron 3.5 and transcribe-cpp"

[dependencies]
# ASR Engine (Nemotron GGUF inference)
transcribe-cpp = { version = "0.3.1", default-features = false, features = ["serde"] }

# VAD (Voice Activity Detection)
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
earshot = "1.2.2"

# Audio Capture & Processing
cpal = "0.16.0"
rubato = "0.16.2"
hound = "3.5.1"
rtrb = "0.4.0"

# Async & Utilities
tokio = { version = "1.43.0", features = ["full"] }
anyhow = "1.0.95"
log = "0.4.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
regex = "1"
chrono = "0.4"
whatlang = "0.16"
isolang = "2"
